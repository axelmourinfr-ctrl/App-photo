<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diaporama — Fête des Familles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#111;color:white;font-family:'Nunito',sans-serif;overflow:hidden;height:100vh}

    /* Photo plein écran */
    .slide-bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .8s ease;opacity:0}
    .slide-bg.visible{opacity:1}
    .slide-bg.blur-bg{filter:blur(24px) brightness(.5);transform:scale(1.08)}

    /* Photo centrée nette par-dessus */
    .slide-img-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    .slide-img{max-width:100vw;max-height:100vh;object-fit:contain;opacity:0;transition:opacity .8s ease;border-radius:0}
    .slide-img.visible{opacity:1}

    /* En-tête */
    .slide-header{position:fixed;top:0;left:0;right:0;z-index:10;padding:1.5rem 2rem 3rem;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
    .slide-event-name{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#F2813A,#F9C53B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    /* Pied */
    .slide-footer{position:fixed;bottom:4px;left:0;right:0;z-index:10;padding:3rem 2rem 1.5rem;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);display:flex;align-items:flex-end;justify-content:space-between}
    .slide-pseudo{font-family:'Baloo 2',cursive;font-size:2.2rem;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.6)}
    .slide-meta{text-align:right}
    .slide-cat{font-size:1.3rem;margin-bottom:.2rem}
    .slide-counter{font-size:.95rem;opacity:.65;font-weight:700}

    /* Barre progression */
    .progress-wrap{position:fixed;bottom:0;left:0;right:0;height:5px;background:rgba(255,255,255,.15);z-index:20}
    .progress-bar{height:100%;background:linear-gradient(to right,#E8452C,#F9C53B);width:0%}

    /* Vide */
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1rem;color:rgba(255,255,255,.55);text-align:center}
    .empty-icon{font-size:5rem}
    .empty-title{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800}
    .empty-sub{font-size:1.1rem}
  </style>
</head>
<body>

<div id="slideBg"      class="slide-bg blur-bg"></div>
<div class="slide-img-wrap">
  <img id="slideImg" class="slide-img" src="" alt="">
</div>
<div class="slide-header">
  <div class="slide-event-name" id="slideEventName"></div>
</div>
<div class="slide-footer">
  <div class="slide-pseudo"  id="slidePseudo"></div>
  <div class="slide-meta">
    <div class="slide-cat"     id="slideCat"></div>
    <div class="slide-counter" id="slideCounter"></div>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="empty hidden" id="emptyState">
  <div class="empty-icon">📷</div>
  <div class="empty-title">Aucune photo approuvée</div>
  <div class="empty-sub">Approuvez des photos depuis le panel admin<br>pour démarrer le diaporama.</div>
</div>

<script src="../js/config.js"></script>
<script>
  // ── Données ────────────────────────────────
  let photos      = [];
  let index       = 0;
  let slideTimer  = null;

  const INTERVAL   = APP_CONFIG.slideshow.intervalMs;
  const SCRIPT_URL = APP_CONFIG.scriptUrl;

  // ── Noms affichés ──────────────────────────
  document.getElementById("slideEventName").textContent =
    APP_CONFIG.eventEmoji + " " + APP_CONFIG.eventName;

  // ── Chargement depuis Apps Script ──────────
  async function loadPhotos() {
    try {
      const url = `${SCRIPT_URL}?action=getPhotos&edition=${APP_CONFIG.eventEdition}&status=approved`;
      const res = await fetch(url);
      const data = await res.json();
      photos = data || [];
    } catch (e) {
      console.error("Chargement diaporama :", e);
      photos = [];
    }

    if (photos.length === 0) {
      document.getElementById("emptyState").classList.remove("hidden");
    } else {
      document.getElementById("emptyState").classList.add("hidden");
      startSlideshow();
    }

    // Rechargement toutes les 60s pour intégrer nouvelles photos approuvées
    setTimeout(loadPhotos, 60000);
  }

  // ── Démarrage ─────────────────────────────
  function startSlideshow() {
    clearInterval(slideTimer);
    showSlide(index);
    slideTimer = setInterval(nextSlide, INTERVAL);
  }

  // ── Affichage d'un slide ──────────────────
  function showSlide(i) {
    if (!photos.length) return;
    const photo = photos[i];
    const cat   = APP_CONFIG.categories.find(c => c.id === photo.category);

    // Fond flouté
    const bg = document.getElementById("slideBg");
    bg.classList.remove("visible");
    setTimeout(() => {
      bg.style.backgroundImage = `url(${photo.url})`;
      bg.classList.add("visible");
    }, 100);

    // Image nette
    const img = document.getElementById("slideImg");
    img.classList.remove("visible");
    img.onload = () => img.classList.add("visible");
    img.src = photo.url;

    // Méta
    document.getElementById("slidePseudo").textContent  = photo.pseudo || "";
    document.getElementById("slideCat").textContent     = cat ? cat.emoji + " " + cat.label : "";
    document.getElementById("slideCounter").textContent = `${i + 1} / ${photos.length}`;

    animateProgress();
  }

  function nextSlide() { index = (index + 1) % photos.length; showSlide(index); }
  function prevSlide() { index = (index - 1 + photos.length) % photos.length; showSlide(index); clearInterval(slideTimer); slideTimer = setInterval(nextSlide, INTERVAL); }

  // ── Barre de progression ──────────────────
  function animateProgress() {
    const bar = document.getElementById("progressBar");
    bar.style.transition = "none"; bar.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = `width ${INTERVAL}ms linear`;
      bar.style.width = "100%";
    }));
  }

  // ── Clavier ───────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") nextSlide();
    if (e.key === "ArrowLeft") prevSlide();
  });

  // ── Swipe mobile ──────────────────────────
  let tx = 0;
  document.addEventListener("touchstart", e => tx = e.touches[0].clientX);
  document.addEventListener("touchend",   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 60) { dx < 0 ? nextSlide() : prevSlide(); clearInterval(slideTimer); slideTimer = setInterval(nextSlide, INTERVAL); }
  });

  // ── Démarrage ─────────────────────────────
  loadPhotos();
</script>
</body>
</html>
